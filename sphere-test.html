<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sphere Diagnostic</title>
<style>
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; padding: 20px; background:#fff; color:#111; }
  #readout { font-size: 15px; line-height: 1.9; margin-bottom: 20px; padding:14px; background:#f4f4f4; border-radius:8px; }
  #readout b { display:inline-block; min-width: 260px; }
  .val { font-weight:700; }
  .good { color: #0a7d28; }
  .bad { color: #c81e1e; }
  .brand-grid { position:relative; width:340px; height:320px; margin:20px auto; border:1px dashed #ccc; }
  .brand-cell {
    position:absolute; left:50%; top:50%; width:58px; height:58px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%; border:1px solid rgba(0,0,0,.25);
    background:#fafafa; font-size:11px; font-weight:700;
    will-change:transform, opacity; user-select:none;
  }
</style>
</head>
<body>

<h2>تست چرخش کره</h2>

<div id="readout">
  <div><b>rAF frames counted:</b> <span class="val" id="rafCount">0</span></div>
  <div><b>setInterval ticks counted:</b> <span class="val" id="ivCount">0</span></div>
  <div><b>prefers-reduced-motion: reduce?</b> <span class="val" id="prm">?</span></div>
  <div><b>document.hidden?</b> <span class="val" id="hid">?</span></div>
  <div><b>transform of first cell:</b> <span class="val" id="tf">?</span></div>
  <div><b>VERDICT:</b> <span class="val" id="verdict">measuring…</span></div>
</div>

<div class="brand-grid" id="brand-grid"></div>

<script>
// Exactly the same sphere math as the real site, with 14 placeholder cells.
var grid = document.getElementById('brand-grid');
var NAMES = ['Tosan','Digit','Persil','Tazh','3Engine','Monly','Lina','Qlean','Danone','Fanta','Irancell','Schauma','Netbina','Vam30'];
NAMES.forEach(function(n){
  var cell = document.createElement('div');
  cell.className = 'brand-cell';
  cell.textContent = n.slice(0,4);
  grid.appendChild(cell);
});

var cells = [].slice.call(grid.children);
var N = cells.length;
var goldenAngle = Math.PI * (3 - Math.sqrt(5));
var points = cells.map(function(_, i){
  var y = 1 - (2 * i + 1) / N;
  var r = Math.sqrt(Math.max(0, 1 - y * y));
  var theta = goldenAngle * i;
  return { x: Math.cos(theta) * r, y: y, z: Math.sin(theta) * r };
});
var R = 145, P = 500;
var AUTO_SPEED = 0.0028;
var rotY = 0, rotX = 0;

var rafCount = 0, ivCount = 0;

setInterval(function(){
  ivCount++;
  document.getElementById('ivCount').textContent = ivCount;
}, 100);

(function spin(){
  rafCount++;
  rotY += AUTO_SPEED;
  var cosY = Math.cos(rotY), sinY = Math.sin(rotY);
  var cosX = Math.cos(rotX), sinX = Math.sin(rotX);
  cells.forEach(function(cell, i){
    var p = points[i];
    var rx = p.x * cosY - p.z * sinY;
    var rz1 = p.x * sinY + p.z * cosY;
    var ry = p.y * cosX - rz1 * sinX;
    var rz = p.y * sinX + rz1 * cosX;
    var X = rx * R, Y = ry * R, Z = rz * R;
    var scale = P / (P + Z);
    cell.style.transform = 'translate(' + X.toFixed(1) + 'px,' + Y.toFixed(1) + 'px) translate(-50%,-50%) scale(' + scale.toFixed(3) + ')';
    cell.style.zIndex = Math.round((Z + R) * 10);
    cell.style.opacity = Math.max(.35, Math.min(1, (scale - .58) / .55));
  });
  requestAnimationFrame(spin);
})();

setInterval(function(){
  document.getElementById('rafCount').textContent = rafCount;
  document.getElementById('tf').textContent = cells[0].style.transform;
  var prm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var prmEl = document.getElementById('prm');
  prmEl.textContent = prm ? 'YES (reduce)' : 'no';
  prmEl.className = 'val ' + (prm ? 'bad' : 'good');
  document.getElementById('hid').textContent = document.hidden ? 'YES' : 'no';

  var v = document.getElementById('verdict');
  if (rafCount < 5) {
    v.textContent = 'requestAnimationFrame is DEAD / blocked';
    v.className = 'val bad';
  } else if (rafCount < ivCount / 2) {
    v.textContent = 'rAF running but heavily throttled (' + rafCount + ' frames)';
    v.className = 'val bad';
  } else {
    v.textContent = 'rAF healthy — sphere should be visibly spinning';
    v.className = 'val good';
  }
}, 300);
</script>

</body>
</html>
